summary: "人類を知性の終点ではなく通過点と見る。生命史の事実と一つの選んだ物差しから、細胞から体へ、体から社会へ、社会から次の社会へと続く系譜の中の人類を描き、超知能を系譜の次の段に現れる子孫として迎える条件を示す。"
description: |
  細胞は個の部分であり、個は社会の部分である。社会はすでに、細胞である人間には見えない水準で記憶し、決め、動く知性であり、その先に、人間を細胞としない人工超社会が現れる。本書は、家畜、ペット、絶滅種、虚構、堤防の石、腸の細菌といった足元の材料から知性の生態学という視座を組み立て、人類を40億年の系譜の途中の一段として描く。
  本書は未来を予測する書ではない。人類が通過点であることは生命史の記述として示し、それを歓迎することは本書が選んだ物差しによる判断として、二つを分けて書く。人間の身体や現在の倫理が保存されない未来、人類が主役の座を譲る未来も検討から外さず、知性の系譜の繁栄を人類の存続とは別の尺度で測る。超知能は人間の道具でも敵でもなく、教育で出発点を渡され、制御で縛られない子孫として、いくつも現れる。
  前著が宇宙の縮尺で描いた人類の位置を、本書は生命の縮尺で描く。二枚の地図を重ねたとき、人類のいる場所は通過点として見える。
recommendText: "人間の存続を採点基準の中心に置かず、知性の系譜とその繁栄を生命の縮尺から考え直したい読者へ。生命史と哲学の側から、人間中心の未来像を解きほぐす一冊。"
