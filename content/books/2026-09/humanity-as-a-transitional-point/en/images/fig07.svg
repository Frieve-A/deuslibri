<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Necrosis and Metabolism" viewBox="0 0 1200 650" width="1200" height="650"><rect width="100%" height="100%" fill="white"/><text x="60" y="85" fill="#183b69" font-size="44" font-weight="700" font-family="Arial, Helvetica, sans-serif">Necrosis and Metabolism</text><line x1="60" y1="115" x2="1140" y2="115" stroke="#183b69" stroke-width="3"/><rect x="60" y="165" width="1080" height="180" rx="22" fill="#f2f6fb" stroke="#bfd0e4" stroke-width="2"/><text x="90" y="217" fill="#183b69" font-size="30" font-weight="700" font-family="Arial, Helvetica, sans-serif">Necrosis</text><text x="94" y="275" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Record → sealed → preserved without loss → no new knowledge.</text><rect x="60" y="375" width="1080" height="210" rx="22" fill="#f2f6fb" stroke="#bfd0e4" stroke-width="2"/><text x="90" y="427" fill="#183b69" font-size="30" font-weight="700" font-family="Arial, Helvetica, sans-serif">Metabolism</text><text x="94" y="485" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Record → read → transformed, misread, criticized, recombined →</text><text x="94" y="521.18" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">new knowledge → record …</text></svg>