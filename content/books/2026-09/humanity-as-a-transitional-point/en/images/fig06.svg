<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Monolith Illusion and an Ecosystem" viewBox="0 0 1200 750" width="1200" height="750"><rect width="100%" height="100%" fill="white"/><text x="60" y="85" fill="#183b69" font-size="44" font-weight="700" font-family="Arial, Helvetica, sans-serif">The Monolith Illusion and an Ecosystem</text><line x1="60" y1="115" x2="1140" y2="115" stroke="#183b69" stroke-width="3"/><rect x="60" y="165" width="505" height="480" rx="22" fill="#f2f6fb" stroke="#bfd0e4" stroke-width="2"/><text x="90" y="217" fill="#183b69" font-size="30" font-weight="700" font-family="Arial, Helvetica, sans-serif">The monolith illusion</text><text x="94" y="275" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">A single will.</text><text x="94" y="327" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">One soul.</text><text x="578" y="380" fill="#183b69" font-size="54" font-weight="400" font-family="Arial, Helvetica, sans-serif">→</text><rect x="640" y="165" width="500" height="480" rx="22" fill="#f2f6fb" stroke="#bfd0e4" stroke-width="2"/><text x="670" y="217" fill="#183b69" font-size="30" font-weight="700" font-family="Arial, Helvetica, sans-serif">Superintelligence as an</text><text x="670" y="257.2" fill="#183b69" font-size="30" font-weight="700" font-family="Arial, Helvetica, sans-serif">ecosystem</text><text x="674" y="315" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Hypothesis generation and</text><text x="674" y="351.18" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">criticism.</text><text x="674" y="404" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Memory, reasoning, and</text><text x="674" y="440.18" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">sensing.</text><text x="674" y="493" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Heat and power metabolism.</text><text x="674" y="545" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Ceaseless exchange with the</text><text x="674" y="581.18" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">environment.</text></svg>