<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Loop of Exploration" viewBox="0 0 1200 620" width="1200" height="620"><rect width="100%" height="100%" fill="white"/><text x="60" y="85" fill="#183b69" font-size="44" font-weight="700" font-family="Arial, Helvetica, sans-serif">The Loop of Exploration</text><line x1="60" y1="115" x2="1140" y2="115" stroke="#183b69" stroke-width="3"/><text x="70" y="180" fill="#183b69" font-size="29" font-weight="400" font-family="Arial, Helvetica, sans-serif">External change: asteroid impacts, supervolcanic eruptions, ice ages</text><rect x="65" y="250" width="300" height="180" rx="22" fill="#f2f6fb" stroke="#bfd0e4" stroke-width="2"/><text x="95" y="302" fill="#183b69" font-size="30" font-weight="700" font-family="Arial, Helvetica, sans-serif">Environment</text><text x="99" y="360" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Selects changes</text><rect x="450" y="250" width="300" height="180" rx="22" fill="#f2f6fb" stroke="#bfd0e4" stroke-width="2"/><text x="480" y="302" fill="#183b69" font-size="30" font-weight="700" font-family="Arial, Helvetica, sans-serif">Individuals</text><text x="484" y="360" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Change</text><rect x="835" y="250" width="300" height="180" rx="22" fill="#f2f6fb" stroke="#bfd0e4" stroke-width="2"/><text x="865" y="302" fill="#183b69" font-size="30" font-weight="700" font-family="Arial, Helvetica, sans-serif">Groups and</text><text x="865" y="342.2" fill="#183b69" font-size="30" font-weight="700" font-family="Arial, Helvetica, sans-serif">societies</text><text x="869" y="400" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Change</text><text x="383" y="350" fill="#183b69" font-size="54" font-weight="400" font-family="Arial, Helvetica, sans-serif">→</text><text x="768" y="350" fill="#183b69" font-size="54" font-weight="400" font-family="Arial, Helvetica, sans-serif">→</text><text x="120" y="520" fill="#183b69" font-size="30" font-weight="700" font-family="Arial, Helvetica, sans-serif">Life remakes the environment, completing the loop.</text></svg>