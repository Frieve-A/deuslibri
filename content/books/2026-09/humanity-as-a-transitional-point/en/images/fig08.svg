<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two Roads of Inheritance" viewBox="0 0 1200 780" width="1200" height="780"><rect width="100%" height="100%" fill="white"/><text x="60" y="85" fill="#183b69" font-size="44" font-weight="700" font-family="Arial, Helvetica, sans-serif">Two Roads of Inheritance</text><line x1="60" y1="115" x2="1140" y2="115" stroke="#183b69" stroke-width="3"/><rect x="60" y="165" width="1080" height="250" rx="22" fill="#f2f6fb" stroke="#bfd0e4" stroke-width="2"/><text x="90" y="217" fill="#183b69" font-size="30" font-weight="700" font-family="Arial, Helvetica, sans-serif">The road of the genes</text><text x="94" y="275" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">An individual's genome is halved every generation.</text><text x="94" y="327" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">After a thousand years, one bloodline carries one ten-billionth</text><text x="94" y="363.18" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">on average.</text><rect x="60" y="440" width="1080" height="265" rx="22" fill="#f2f6fb" stroke="#bfd0e4" stroke-width="2"/><text x="90" y="492" fill="#183b69" font-size="30" font-weight="700" font-family="Arial, Helvetica, sans-serif">The road outside the genes</text><text x="94" y="550" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">An individual's methods and questions are copied, improved, and</text><text x="94" y="586.18" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">taught.</text><text x="94" y="639" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">After a thousand years, they still work in countless hands and</text><text x="94" y="675.18" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">machines.</text></svg>