<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Bacterium and the History of Life" viewBox="0 0 1200 670" width="1200" height="670"><rect width="100%" height="100%" fill="white"/><text x="60" y="85" fill="#183b69" font-size="44" font-weight="700" font-family="Arial, Helvetica, sans-serif">The Bacterium and the History of Life</text><line x1="60" y1="115" x2="1140" y2="115" stroke="#183b69" stroke-width="3"/><rect x="60" y="165" width="1080" height="190" rx="22" fill="#f2f6fb" stroke="#bfd0e4" stroke-width="2"/><text x="90" y="217" fill="#183b69" font-size="30" font-weight="700" font-family="Arial, Helvetica, sans-serif">The independent bacterium</text><text x="94" y="275" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Endosymbiosis means giving up autonomy and most of its genes.</text><rect x="60" y="385" width="1080" height="215" rx="22" fill="#f2f6fb" stroke="#bfd0e4" stroke-width="2"/><text x="90" y="437" fill="#183b69" font-size="30" font-weight="700" font-family="Arial, Helvetica, sans-serif">The view of life's history</text><text x="94" y="495" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">The bacterium enters a cell; the eukaryotic cell is born.</text><text x="94" y="547" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Its line later gives rise to multicellularity, brains, and</text><text x="94" y="583.18" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">societies.</text></svg>