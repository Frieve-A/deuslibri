<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Whose Descendant?" viewBox="0 0 1200 1450" width="1200" height="1450"><rect width="100%" height="100%" fill="white"/><text x="60" y="85" fill="#183b69" font-size="44" font-weight="700" font-family="Arial, Helvetica, sans-serif">Whose Descendant?</text><line x1="60" y1="115" x2="1140" y2="115" stroke="#183b69" stroke-width="3"/><circle cx="600" cy="540" r="390" fill="none" stroke="#183b69" stroke-width="3"/><text x="480" y="198" fill="#183b69" font-size="27" font-weight="700" font-family="Arial, Helvetica, sans-serif">Intelligence</text><circle cx="600" cy="540" r="305" fill="none" stroke="#192432" stroke-width="3"/><text x="560" y="283" fill="#192432" font-size="27" font-weight="700" font-family="Arial, Helvetica, sans-serif">Life</text><circle cx="600" cy="540" r="220" fill="none" stroke="#192432" stroke-width="3"/><text x="520" y="368" fill="#192432" font-size="27" font-weight="700" font-family="Arial, Helvetica, sans-serif">Humanity</text><circle cx="600" cy="540" r="135" fill="none" stroke="#192432" stroke-width="3"/><text x="550" y="453" fill="#192432" font-size="27" font-weight="700" font-family="Arial, Helvetica, sans-serif">Human</text><text x="80" y="1010" fill="#192432" font-size="30" font-weight="400" font-family="Arial, Helvetica, sans-serif">Human = one human life</text><text x="80" y="1070" fill="#192432" font-size="30" font-weight="400" font-family="Arial, Helvetica, sans-serif">Humanity = a single living species</text><text x="80" y="1130" fill="#192432" font-size="30" font-weight="400" font-family="Arial, Helvetica, sans-serif">Life = a lineage of four billion years</text><text x="80" y="1190" fill="#192432" font-size="30" font-weight="400" font-family="Arial, Helvetica, sans-serif">Intelligence = larger intelligences, appearing one after another</text><text x="80" y="1290" fill="#183b69" font-size="29" font-weight="700" font-family="Arial, Helvetica, sans-serif">From an inner ring, the outer ring looks like a delusion. From the</text><text x="80" y="1328.86" fill="#183b69" font-size="29" font-weight="700" font-family="Arial, Helvetica, sans-serif">outer ring, the inner ring is a transitional point.</text></svg>