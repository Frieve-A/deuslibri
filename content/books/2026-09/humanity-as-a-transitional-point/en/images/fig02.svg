<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Staircase of Units and Means for Handling Information" viewBox="0 0 1250 2050" width="1250" height="2050"><rect width="100%" height="100%" fill="white"/><text x="60" y="85" fill="#183b69" font-size="32" font-weight="700" font-family="Arial, Helvetica, sans-serif">The Staircase of Units and Means for Handling Information</text><line x1="60" y1="115" x2="1190" y2="115" stroke="#183b69" stroke-width="3"/><line x1="370" y1="165" x2="370" y2="1980" stroke="#a8bfdb" stroke-width="5"/><circle cx="370" cy="190" r="10" fill="#183b69"/><text x="60" y="200" fill="#183b69" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">c. 4 billion years</text><text x="60" y="233.5" fill="#183b69" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">ago</text><text x="410" y="200" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Self-copying molecules become membrane-bound</text><text x="410" y="236.18" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">cells.</text><circle cx="370" cy="303" r="10" fill="#183b69"/><text x="60" y="313" fill="#183b69" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">c. 2 billion years</text><text x="60" y="346.5" fill="#183b69" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">ago</text><text x="410" y="313" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">A cell takes another inside it, gaining</text><text x="410" y="349.18" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">organelles.</text><circle cx="370" cy="416" r="10" fill="#183b69"/><text x="60" y="426" fill="#183b69" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">Over 1 billion years</text><text x="60" y="459.5" fill="#183b69" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">ago</text><text x="410" y="426" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Cells gather into one body in many separate</text><text x="410" y="462.18" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">lines.</text><circle cx="370" cy="529" r="10" fill="#183b69"/><text x="60" y="539" fill="#183b69" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">c. 500 million years</text><text x="60" y="572.5" fill="#183b69" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">ago</text><text x="410" y="539" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Bodies acquire nerves, brains, and eyes.</text><circle cx="370" cy="642" r="10" fill="#183b69"/><text x="60" y="652" fill="#183b69" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">Over 100 million</text><text x="60" y="685.5" fill="#183b69" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">years ago</text><text x="410" y="652" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Insect nests work like one body.</text><circle cx="370" cy="755" r="10" fill="#183b69"/><text x="60" y="765" fill="#183b69" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">Tens of millions of</text><text x="60" y="798.5" fill="#183b69" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">years ago</text><text x="410" y="765" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Primates appear; young learn from the group.</text><circle cx="370" cy="868" r="10" fill="#183b69"/><text x="60" y="878" fill="#183b69" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">Millions of years</text><text x="60" y="911.5" fill="#183b69" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">ago</text><text x="410" y="878" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Hands hold tools and later handle fire.</text><circle cx="370" cy="981" r="10" fill="#183b69"/><text x="60" y="991" fill="#183b69" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">Hundreds of</text><text x="60" y="1024.5" fill="#183b69" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">thousands of years</text><text x="60" y="1058" fill="#183b69" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">ago</text><text x="410" y="991" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Words connect one head to another.</text><circle cx="370" cy="1094" r="10" fill="#183b69"/><text x="60" y="1104" fill="#183b69" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">c. 100,000 years ago</text><text x="410" y="1104" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Ornaments, graves, and pictures place symbols</text><text x="410" y="1140.18" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">outside the head.</text><circle cx="370" cy="1207" r="10" fill="#183b69"/><text x="60" y="1217" fill="#183b69" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">c. 10,000 years ago</text><text x="410" y="1217" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Farming and settlement turn groups into</text><text x="410" y="1253.18" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">villages.</text><circle cx="370" cy="1320" r="10" fill="#183b69"/><text x="60" y="1330" fill="#183b69" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">c. 5,000 years ago</text><text x="410" y="1330" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Cities and writing place memory outside the</text><text x="410" y="1366.18" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">head.</text><circle cx="370" cy="1433" r="10" fill="#183b69"/><text x="60" y="1443" fill="#183b69" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">c. 500 years ago</text><text x="410" y="1443" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Printing spreads; science copies and checks</text><text x="410" y="1479.18" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">knowledge.</text><circle cx="370" cy="1546" r="10" fill="#183b69"/><text x="60" y="1556" fill="#183b69" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">100 to 200 years ago</text><text x="410" y="1556" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Telegraph and broadcasting carry words around</text><text x="410" y="1592.18" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Earth.</text><circle cx="370" cy="1659" r="10" fill="#183b69"/><text x="60" y="1669" fill="#183b69" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">Decades ago</text><text x="410" y="1669" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Computers and the internet calculate and connect</text><text x="410" y="1705.18" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">heads.</text><circle cx="370" cy="1772" r="10" fill="#183b69"/><text x="60" y="1782" fill="#183b69" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">Now</text><text x="410" y="1782" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">AI learns from human records and thinks outside</text><text x="410" y="1818.18" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">the head.</text><circle cx="370" cy="1885" r="10" fill="#183b69"/><text x="60" y="1895" fill="#183b69" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">Next</text><text x="410" y="1895" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">ASI and an artificial supersociety whose cells</text><text x="410" y="1931.18" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">are not human.</text></svg>