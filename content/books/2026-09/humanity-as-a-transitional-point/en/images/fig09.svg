<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Individual and the Collective Descendant" viewBox="0 0 1200 710" width="1200" height="710"><rect width="100%" height="100%" fill="white"/><text x="60" y="85" fill="#183b69" font-size="44" font-weight="700" font-family="Arial, Helvetica, sans-serif">The Individual and the Collective Descendant</text><line x1="60" y1="115" x2="1140" y2="115" stroke="#183b69" stroke-width="3"/><rect x="60" y="165" width="1080" height="205" rx="22" fill="#f2f6fb" stroke="#bfd0e4" stroke-width="2"/><text x="90" y="217" fill="#183b69" font-size="30" font-weight="700" font-family="Arial, Helvetica, sans-serif">The isolated individual's view</text><text x="94" y="275" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Life → death and departure → nothing, complete oblivion.</text><text x="94" y="327" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Future society appears to be an unrelated outside.</text><rect x="60" y="400" width="1080" height="240" rx="22" fill="#f2f6fb" stroke="#bfd0e4" stroke-width="2"/><text x="90" y="452" fill="#183b69" font-size="30" font-weight="700" font-family="Arial, Helvetica, sans-serif">Society as a collective descendant</text><text x="94" y="510" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Labor, methods, and norms settle into its structure.</text><text x="94" y="562" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">They become conditions for future society to exist: a real</text><text x="94" y="598.18" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">inheritance without a name.</text></svg>