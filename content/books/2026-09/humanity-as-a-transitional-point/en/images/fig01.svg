<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two Versions of the Same Planet" viewBox="0 0 1200 720" width="1200" height="720"><rect width="100%" height="100%" fill="white"/><text x="60" y="85" fill="#183b69" font-size="44" font-weight="700" font-family="Arial, Helvetica, sans-serif">Two Versions of the Same Planet</text><line x1="60" y1="115" x2="1140" y2="115" stroke="#183b69" stroke-width="3"/><rect x="60" y="155" width="520" height="500" rx="22" fill="#f2f6fb" stroke="#bfd0e4" stroke-width="2"/><text x="90" y="207" fill="#183b69" font-size="30" font-weight="700" font-family="Arial, Helvetica, sans-serif">The first version</text><text x="94" y="265" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Humanity remains at the peak.</text><text x="94" y="317" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Intelligence stops at the</text><text x="94" y="353.18" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">human level.</text><text x="94" y="406" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">No hunger and no war.</text><text x="94" y="458" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">The same forms stand in rows.</text><text x="94" y="510" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Nothing grows beyond humanity.</text><rect x="620" y="155" width="520" height="500" rx="22" fill="#f2f6fb" stroke="#bfd0e4" stroke-width="2"/><text x="650" y="207" fill="#183b69" font-size="30" font-weight="700" font-family="Arial, Helvetica, sans-serif">The second version</text><text x="654" y="265" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">There is no humanity.</text><text x="654" y="317" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">Structures no human can read</text><text x="654" y="353.18" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">assemble on a planetary scale.</text><text x="654" y="406" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">They keep recombining.</text><text x="654" y="458" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">No one looks on and names</text><text x="654" y="494.18" fill="#192432" font-size="27" font-weight="400" font-family="Arial, Helvetica, sans-serif">them.</text></svg>