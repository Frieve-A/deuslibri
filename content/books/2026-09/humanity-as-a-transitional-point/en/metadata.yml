summary: "This book sees humanity not as the endpoint of intelligence but as a transitional point. From the facts of life's history and one chosen yardstick, it draws humanity within the lineage that runs from cell to body, from body to society, and from society to the next society, and shows the conditions for welcoming superintelligence as a descendant that appears at the next step of the lineage."
description: |
  The cell is part of the individual, and the individual is part of society. Society is already an intelligence that remembers, decides, and acts at a level invisible to the humans who are its cells, and beyond it appears an artificial supersociety whose cells are not human. From materials at our feet—livestock, pets, extinct species, fiction, the stones of a levee, and the bacteria of the gut—this book assembles the vantage point of the ecology of intelligence and draws humanity as one step partway along the four-billion-year lineage.
  This book is not a book of prediction. It shows, as a description of life's history, that humanity is a transitional point, and writes welcoming it as a judgment by the yardstick this book has chosen, keeping the two apart. It excludes from consideration neither a future in which human bodies and today's ethics are not preserved nor a future in which humanity yields the protagonist's seat, and it measures the flourishing of the lineage of intelligence by a measure other than humanity's survival. Superintelligence, neither humanity's tool nor its enemy, appears in numbers, as descendants that are handed a starting point through education and are not bound by control.
  This book draws, at the scale of life, humanity's position that the previous book drew at the scale of the universe. When the two maps are laid one over the other, the place where humanity stands appears as a transitional point.
recommendText: "For readers who want to rethink the lineage of intelligence and its flourishing at the scale of life without placing human survival at the center of the grading criteria. A book that untangles the human-centered picture of the future from the side of life's history and philosophy."
